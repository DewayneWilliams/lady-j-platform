{% extends "base.html" %}
{% block title %}Reset Password | Lady J{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:520px">
    <span class="eyebrow">Account recovery</span>
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your email and we will send a secure, time-limited reset link.</p>
    <form method="post" class="form-grid" style="margin-top:1.5rem">
      <label>Email
        <input type="email" name="email" required autocomplete="email">
      </label>
      <button class="btn" type="submit">Send Reset Link</button>
    </form>
    <p style="margin-top:1rem"><a href="{{ url_for('auth.login') }}">Return to sign in</a></p>
  </div>
</section>
{% endblock %}
