{% extends "base.html" %}
{% block title %}Set New Password | Lady J{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:520px">
    <span class="eyebrow">Secure reset</span>
    <h1>Set a new password</h1>
    <p class="muted">Your new password must contain at least 12 characters.</p>
    <form method="post" class="form-grid" style="margin-top:1.5rem">
      <label>New password
        <input type="password" name="password" minlength="12" required autocomplete="new-password">
      </label>
      <label>Confirm new password
        <input type="password" name="confirm_password" minlength="12" required autocomplete="new-password">
      </label>
      <button class="btn" type="submit">Reset Password</button>
    </form>
  </div>
</section>
{% endblock %}
